<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>გამარჯვების სახლი · 3D</title>
<meta name="description" content="გამარჯვების სახლის ინტერაქტიული 3D მაკეტი PDF ნახაზების მიხედვით (1 ერთეული = 1 მ).">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c2652a'/><path d='M7 16l9-7 9 7v9H7z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/></svg>">
<link rel="canonical" href="https://gamarjveba-house-3d.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:title" content="გამარჯვების სახლი · 3D">
<meta property="og:description" content="სახლის ინტერაქტიული 3D მაკეტი — Orbit, Walk და Plan რეჟიმები">
<meta property="og:url" content="https://gamarjveba-house-3d.vercel.app/">
<style>
:root{
  --panel:rgba(255,255,255,.82); --panel-solid:rgba(255,255,255,.96); --line:rgba(30,35,40,.1); --text:#1f2429; --muted:#69717a;
  --btn:rgba(255,255,255,.7); --btn-hover:#fff;
  --accent:#c2652a; --accent-soft:rgba(194,101,42,.12); --ok:#1f7a4d; --ok-bg:rgba(31,122,77,.11); --meas:#a8510f; --meas-bg:rgba(217,72,15,.1); --asm:#5b636c; --asm-bg:rgba(30,35,40,.07);
  --shadow:0 8px 26px rgba(40,35,30,.12), 0 1px 2px rgba(40,35,30,.1); --r:14px;
  --font:"Noto Sans Georgian","BPG Arial","Sylfaen","Segoe UI",system-ui,-apple-system,sans-serif;
  --nav-h:60px;
}
*{box-sizing:border-box}
/* გვერდი არ სქროლდება; შეხების შეზღუდვა (touch-action) — მხოლოდ 3D არეში და ჯოისტიკზე, პანელები სქროლდება */
html,body{margin:0;height:100%;background:#eceae6;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0;touch-action:none}
#c{display:block;width:100%;height:100%;outline:none;cursor:grab;touch-action:none}
#c:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.panel{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.brand{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));padding:10px 14px;max-width:min(420px,calc(100vw - 28px))}
.brand h1{margin:0;font-size:16px;line-height:1.25;font-weight:700;display:flex;align-items:center;gap:8px}
.brand h1 i{width:10px;height:10px;border-radius:3px;background:var(--accent);flex:none}
.brand p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.toolbar{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));width:228px;padding:10px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 28px);overflow:auto;touch-action:pan-y;z-index:4}
.group{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.group h3{grid-column:1/-1;margin:2px 2px 0;font-size:11px;font-weight:600;color:var(--muted)}
.btn{display:flex;align-items:center;gap:7px;min-height:38px;padding:7px 9px;border:1px solid var(--line);background:var(--btn);border-radius:10px;font-size:12.5px;line-height:1.2;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.btn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:var(--btn-hover);border-color:rgba(30,35,40,.2)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.btn[aria-pressed]{position:relative;padding-right:30px}
.btn[aria-pressed]::after{content:"";position:absolute;right:9px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:4px;border:1.6px solid rgba(30,35,40,.3)}
.btn[aria-pressed="true"]::after{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2.5px #fff}
.btn.wide{grid-column:1/-1}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#d0733a}
.btn:disabled{opacity:.55;cursor:progress}
.btn .ts{display:none}
#info{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:calc(max(14px,env(safe-area-inset-bottom)) + var(--nav-h) + 10px);width:350px;max-width:calc(100vw - 28px);max-height:calc(100vh - 170px);overflow:auto;background:var(--panel-solid);padding:12px 14px;z-index:5;touch-action:pan-y}
#info .meta{font-size:11.5px;color:var(--muted);padding-right:28px}
#info h2{margin:3px 0 8px;font-size:15px;line-height:1.3;padding-right:24px}
#info table{width:100%;border-collapse:collapse;font-size:12.5px}
#info th{text-align:left;font-weight:500;color:var(--muted);padding:4px 6px 4px 0;white-space:nowrap}
#info td{padding:4px 0;font-variant-numeric:tabular-nums}
#info td:last-child{text-align:right}
#info .note,#info .src{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.4}
#info .src{font-size:11px}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:99px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.meas{background:var(--meas-bg);color:var(--meas)}
.badge.asm{background:var(--asm-bg);color:var(--asm)}
.icon-btn{position:absolute;top:6px;right:6px;width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--muted);font-size:22px;line-height:44px}
.icon-btn:hover{background:var(--asm-bg)}
#info .actions{margin-top:10px;display:flex;gap:6px}
#info .actions .btn{min-height:40px}
#legend{position:fixed;left:50%;transform:translateX(-50%);top:max(14px,env(safe-area-inset-top));padding:7px 12px;font-size:12px;display:flex;gap:14px;align-items:center;white-space:nowrap}
#legend span{display:inline-flex;align-items:center;gap:6px}
#legend .sw{display:inline-block;width:22px;height:0;border-top:2px solid #1f2933}
#legend .sw.approx{border-top:2px dashed #d9480f}
#toast{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + var(--nav-h) + 14px);transform:translateX(-50%);background:rgba(31,36,41,.92);color:#fff;border-radius:10px;padding:9px 14px;font-size:13px;box-shadow:var(--shadow);z-index:8;max-width:calc(100vw - 24px)}
[hidden]{display:none !important}
.sel{grid-column:1/-1;display:flex;align-items:center;gap:7px;min-height:38px;padding:0 6px 0 9px;border:1px solid var(--line);background:var(--btn);border-radius:10px;font-size:12.5px}
.sel svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sel select{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:inherit;padding:8px 0;cursor:pointer;outline:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#eceae6;color:var(--muted);font-size:14px;z-index:30}
#loading span{background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow)}
.dim{font-size:11px;font-weight:600;padding:1px 5px;border-radius:6px;white-space:nowrap;background:rgba(255,255,255,.95);border:1px solid #1f2933;color:#1f2933;font-variant-numeric:tabular-nums}
.dim.approx{border:1px dashed #d9480f;color:#a33a08}
.room{display:flex;flex-direction:column;align-items:center;font-size:12px;color:#1f2429;text-shadow:0 0 3px #fff,0 0 6px #fff}
.room b{font-size:12.5px;white-space:nowrap}
.room span{font-size:11px;color:#4b535b}
.facade{font-size:12px;font-weight:700;color:#fff;background:var(--accent);padding:2px 8px;border-radius:6px;white-space:nowrap}

/* ---- ნავიგაციის ზოლი (Desktop: კომპაქტური, ცენტრში ქვემოთ) */
#navbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:4px;padding:5px;z-index:6;touch-action:manipulation}
#navbar svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;gap:2px;background:var(--asm-bg);border-radius:11px;padding:3px}
.seg button,.nb{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;padding:0 12px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-size:12.5px;color:var(--text)}
.nb{padding:0}
.nb span{display:none}
.seg button.active{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(40,35,30,.18),inset 0 0 0 1.5px var(--accent);font-weight:600}
.seg button:hover:not(.active),.nb:hover{background:rgba(255,255,255,.85)}
.seg button:focus-visible,.nb:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nb[aria-disabled="true"]{opacity:.42}
.nb[aria-pressed="true"],.nb[aria-expanded="true"]{color:var(--accent);background:var(--accent-soft)}
.sep{width:1px;height:28px;background:var(--line);margin:0 3px}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(31,36,41,.92);color:#fff;font-size:12px;font-weight:500;padding:5px 9px;border-radius:7px;pointer-events:none}
.mobile-only{display:none !important}

/* ---- დახმარება */
#help{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom)) + var(--nav-h) + 10px);width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 160px);overflow:auto;background:var(--panel-solid);padding:12px 16px 14px;z-index:7;touch-action:pan-y;-webkit-user-select:text;user-select:text}
#help h2{margin:2px 0 6px;font-size:15px}
#help section{border-top:1px solid var(--line);padding:8px 0 4px}
#help section.cur h3{color:var(--accent)}
#help h3{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:8px}
#help dl{display:grid;grid-template-columns:minmax(170px,auto) 1fr;gap:3px 12px;margin:0;font-size:12.5px}
#help dt{font-weight:600}
#help dd{margin:0;color:var(--muted)}

/* ---- Walk: მინიშნება, ჯვარი, ჯოისტიკი */
#walkhud{position:fixed;left:50%;transform:translateX(-50%);top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;padding:5px 5px 5px 14px;font-size:12.5px;color:var(--muted);max-width:calc(100vw - 24px);transition:opacity .4s;z-index:3}
#walkhud b{color:var(--text)}
#walkhud.dim{opacity:.6}
#walkhud .btn{min-height:40px;white-space:nowrap}
body[data-mode="walk"] #legend{top:calc(max(14px,env(safe-area-inset-top)) + 58px)}
#cross{display:none;position:fixed;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(0,0,0,.45);pointer-events:none;z-index:3}
body.locked #cross{display:block}
#joy{display:none;position:fixed;left:max(18px,env(safe-area-inset-left));bottom:calc(max(10px,env(safe-area-inset-bottom)) + var(--nav-h) + 16px);width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.42);border:1.5px solid rgba(30,35,40,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:none;z-index:4}
#joy .knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--panel-solid);border:1.5px solid rgba(30,35,40,.2);box-shadow:var(--shadow);transition:transform .12s}
#joy.active .knob{transition:none;background:#fff;border-color:var(--accent)}
body[data-mode="walk"].touch #joy{display:block}
body[data-mode="walk"] #c{cursor:crosshair}
body.locked #c{cursor:none}

/* ---- ტელეფონი / ვიწრო ეკრანი: მთავარი ღილაკები ქვედა ზოლში, დანარჩენი — გასაშლელ პანელში */
@media (max-width:760px), (pointer:coarse) and (max-height:500px){
  :root{--nav-h:64px}
  .brand{padding:8px 11px}
  .brand h1{font-size:14px}
  .brand p{font-size:11px}
  .mobile-only{display:flex !important}
  .desktop-only{display:none !important}
  #navbar{left:0;right:0;transform:none;bottom:0;border-radius:16px 16px 0 0;border-left:0;border-right:0;border-bottom:0;justify-content:space-between;gap:2px;padding:6px max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  .seg button{flex-direction:column;gap:1px;padding:3px 9px;font-size:10.5px;min-height:50px}
  .nb{flex-direction:column;gap:1px;min-width:46px;min-height:50px;font-size:10px;padding:2px 3px}
  .nb span{display:block}
  .sep{display:none}
  [data-tip]:hover::after{display:none}
  .toolbar{display:none;top:auto;left:8px;right:8px;width:auto;bottom:calc(max(6px,env(safe-area-inset-bottom)) + var(--nav-h) + 6px);max-height:min(62vh,calc(100vh - 160px));overflow-y:auto;overflow-x:hidden;z-index:6;background:var(--panel-solid)}
  body.sheet-open .toolbar{display:flex}
  .toolbar .btn{min-height:44px}
  .toolbar .sel{min-height:44px}
  #info{left:8px;right:8px;width:auto;max-width:none;bottom:calc(max(6px,env(safe-area-inset-bottom)) + var(--nav-h) + 8px);max-height:calc(100vh - 250px)}
  body[data-mode="walk"] #info{top:calc(max(8px,env(safe-area-inset-top)) + 54px);bottom:auto;max-height:40vh}
  #legend{top:auto;bottom:calc(max(6px,env(safe-area-inset-bottom)) + var(--nav-h) + 8px);font-size:11px}
  #help{bottom:calc(max(6px,env(safe-area-inset-bottom)) + var(--nav-h) + 8px);max-height:calc(100vh - 170px)}
  #help dl{grid-template-columns:1fr;gap:0}
  #help dd{margin-bottom:5px}
  #walkhud{top:max(8px,env(safe-area-inset-top));font-size:11.5px;padding:7px 12px}
}
/* ჰორიზონტალური ტელეფონი */
@media (max-height:500px){
  .brand{display:none}
  #joy{width:112px;height:112px;bottom:calc(max(6px,env(safe-area-inset-bottom)) + var(--nav-h) + 8px)}
  #info{max-height:calc(100vh - 120px)}
  body[data-mode="walk"] #info{top:8px;bottom:auto;left:auto;right:max(8px,env(safe-area-inset-right));width:min(340px,46vw);max-height:calc(100vh - var(--nav-h) - 24px)}
  .toolbar{max-height:calc(100vh - var(--nav-h) - 24px)}
}
body.pseudo-fs .brand,body[data-mode="walk"] .brand{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body data-mode="orbit">
<div id="loading"><span>მოდელი და მასალები მზადდება…</span></div>
<div id="stage"><canvas id="c" aria-label="სახლის 3D მოდელი" tabindex="0"></canvas><div id="labels"></div></div>

<header class="brand panel">
  <h1><i></i>გამარჯვების სახლი</h1>
  <p>3D მაკეტი · ნახაზები A.8–A.16 · 16.3 × 7.5 მ + ტერასა · 1 ერთეული = 1 მ</p>
</header>

<nav class="toolbar panel" id="sidepanel" aria-label="ფენები და პარამეტრები">
  <div class="group">
    <h3>ხედები (Orbit)</h3>
    <button class="btn" data-view="front" title="წინა ხედი — ტერასის ფასადი"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="13" rx="1"/><path d="M4 10h16M10 19v-6h4v6"/></svg><span class="t">წინა ხედი</span><span class="ts">წინა</span></button>
    <button class="btn" data-view="side" title="გვერდხედი — დასავლეთიდან"><svg viewBox="0 0 24 24"><path d="M4 19V8l8-4v15M12 19h8V9l-8-5"/></svg><span class="t">გვერდხედი</span><span class="ts">გვერდი</span></button>
    <button class="btn" id="zoom-in" title="მიახლოება" aria-label="მიახლოება"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3M11 8v6M8 11h6"/></svg><span class="t">ზუმი +</span><span class="ts">ზუმი +</span></button>
    <button class="btn" id="zoom-out" title="დაშორება" aria-label="დაშორება"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3M8 11h6"/></svg><span class="t">ზუმი −</span><span class="ts">ზუმი −</span></button>
    <button class="btn mobile-only" id="fullscreen" title="სრული ეკრანი" aria-label="სრული ეკრანი"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span class="t">სრული ეკრანი</span></button>
    <button class="btn mobile-only" id="sheet-help" aria-label="მართვის ინსტრუქცია"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6M12 17.2v.1"/></svg><span class="t">დახმარება</span></button>
  </div>
  <div class="group">
    <h3>ფენები</h3>
    <button class="btn wide" data-layer="ceiling" aria-pressed="false" title="ჭერის / სახურავის ჩვენება ან დამალვა"><svg viewBox="0 0 24 24"><path d="M3 7h18M5 7v3M19 7v3"/><path d="M7 14h10"/></svg><span class="t">ჭერის ჩვენება/დამალვა</span></button>
    <button class="btn wide" data-layer="exterior" aria-pressed="true" title="გარე კედლების ჩვენება ან დამალვა (შიდა ტიხრები რჩება)"><svg viewBox="0 0 24 24"><path d="M3 20V6h18v14"/><path d="M3 10h18"/></svg><span class="t">გარე კედლების ჩვენება/დამალვა</span></button>
    <button class="btn wide" data-layer="furniture" aria-pressed="true" title="ავეჯის ჩვენება ან დამალვა"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="9" rx="1.5"/><path d="M6 14v5M18 14v5M4 9h16"/></svg><span class="t">ავეჯის ჩვენება/დამალვა</span></button>
    <button class="btn wide" data-layer="dims" aria-pressed="false" title="ზომების ჩვენება ან დამალვა"><svg viewBox="0 0 24 24"><path d="M3 17h18M3 14v6M21 14v6M7 17v-2M11 17v-3M15 17v-2"/><path d="M7 4h10"/></svg><span class="t">ზომების ჩვენება/დამალვა</span></button>
  </div>
  <div class="group">
